<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airport Placard Generator</title>
<style>
:root{--accent:#ffbe33;--dark:#111827;--panel:#fff;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}
.menu-btn{position:fixed;left:18px;top:18px;z-index:20;width:48px;height:48px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:25px;cursor:pointer}
.drawer{position:fixed;left:0;top:0;bottom:0;width:330px;background:#fff;z-index:19;box-shadow:8px 0 30px #0002;transform:translateX(-105%);transition:transform .28s ease;padding:80px 22px 24px;overflow:auto}
.drawer.open{transform:translateX(0)}.drawer h3{margin:0 0 20px}.drawer label{display:block;font-weight:700;margin:18px 0 8px}
select,input[type=file],button.action{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff}
.action{cursor:pointer;background:#111827!important;color:#fff;border:0!important;margin-top:10px}
main{max-width:1100px;margin:0 auto;padding:90px 24px 50px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 5px 24px #0000000c}
h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.preview{margin-top:24px;text-align:center}.preview img{max-width:100%;border:1px solid #ddd}
.status{color:var(--muted);font-size:14px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.drawer{width:85vw}}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
<aside class="drawer" id="drawer">
<h3>Placard Settings</h3>
<label for="font">Font family</label>
<select id="font"></select>
<label>Add font (.TTF / .OTF)</label>
<input id="fontFile" type="file" accept=".ttf,.otf">
<button class="action" id="addFont">Add Font</button>
<label>Remove font</label>
<select id="removeFont"></select>
<button class="action" id="removeFontBtn">Remove Font</button>
<div class="status" id="fontStatus"></div>
</aside>

<main>
<div class="card">
<h1>Airport Placard Generator</h1>
<p>Python-powered 4K placard generation integrated directly into this HTML site.</p>
<div class="grid">
<div><label for="name">Passenger name</label><input id="name" placeholder="e.g. RAJAT VARDIYANI" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:8px"></div>
<div><label>&nbsp;</label><button class="action" id="generate">Generate 4K Placard</button></div>
</div>
<div class="status" id="status">Ready.</div>
<div class="preview" id="preview"></div>
</div>
</main>
<script>
const API='';
const drawer=document.getElementById('drawer');
document.getElementById('menuBtn').onclick=()=>drawer.classList.toggle('open');

async function refreshFonts(){
  const data=await fetch(API+'/api/fonts').then(r=>r.json());
  const font=document.getElementById('font'), remove=document.getElementById('removeFont');
  font.innerHTML=''; remove.innerHTML='';
  data.fonts.forEach(f=>{font.add(new Option(f,f)); remove.add(new Option(f,f));});
  if(data.fonts.length) font.value=data.fonts.includes('DejaVu Serif')?'DejaVu Serif':data.fonts[0];
  document.getElementById('fontStatus').textContent=data.fonts.length+' fonts available';
}
document.getElementById('addFont').onclick=async()=>{
  const file=document.getElementById('fontFile').files[0]; if(!file)return;
  const fd=new FormData(); fd.append('file',file);
  const r=await fetch(API+'/api/fonts/add',{method:'POST',body:fd});
  const data=await r.json(); if(!r.ok){alert(data.detail||'Could not add font');return;}
  await refreshFonts(); document.getElementById('font').value=PathSafe(file.name);
};
function PathSafe(n){return n.replace(/\.[^.]+$/,'');}
document.getElementById('removeFontBtn').onclick=async()=>{
  const f=document.getElementById('removeFont').value;
  const r=await fetch(API+'/api/fonts/'+encodeURIComponent(f),{method:'DELETE'});
  const data=await r.json(); if(!r.ok){alert(data.detail||'Could not remove font');return;}
  await refreshFonts();
};
document.getElementById('generate').onclick=async()=>{
  const name=document.getElementById('name').value.trim()||'GUEST';
  const font=document.getElementById('font').value;
  const fd=new FormData(); fd.append('passenger_name',name); fd.append('font_family',font);
  const status=document.getElementById('status'); status.textContent='Generating 3840 × 2400...';
  const r=await fetch(API+'/api/generate',{method:'POST',body:fd});
  const data=await r.json(); if(!r.ok){status.textContent=data.detail||'Generation failed';return;}
  status.textContent='Generated 3840 × 2400 PNG.';
  document.getElementById('preview').innerHTML='<img src="'+data.file+'?t='+Date.now()+'" alt="Generated placard">';
};
refreshFonts();
</script>
</body>
</html>
